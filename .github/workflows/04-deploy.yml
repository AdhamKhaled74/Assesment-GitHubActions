name: 04 Deploy to EC2 from ECR

on:
  push:
    branches: [main]

env:
  ECR_REPOSITORY: github_actions_assesment
  CONTAINER_NAME: tiny-health-container
  APP_PORT: "8000"
  STATIC_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |

            set -e

            echo "=== Login to ECR ==="
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.STATIC_TAG }}"

            echo "=== Pull image ==="
            docker pull $IMAGE_URI

            echo "=== Stop old container ==="
            docker rm -f ${{ env.CONTAINER_NAME }} || true

            echo "=== Run container ==="
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              -p ${{ env.APP_PORT }}:8000 \
              $IMAGE_URI

            echo "=== Show running container ==="
            docker ps

            echo "=== Smoke test ==="
            for i in 1 2 3 4 5; do
              if curl --fail --silent http://localhost:${{ env.APP_PORT }}/health; then
                echo "APP IS HEALTHY"
                exit 0
              fi
              echo "Waiting..."
              sleep 2
            done

            echo "APP FAILED HEALTH CHECK"
            exit 1

      - name: Optional cleanup on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker rm -f ${{ env.CONTAINER_NAME }} || true
